<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Legal AI Assistant</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 420px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #2c3e50;
            color: white;
            padding: 12px;
            text-align: center;
            font-weight: bold;
        }

        .chat-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background: #fafafa;
        }

        .user-message {
            background: #d1ecf1;
            margin: 6px 0;
            padding: 8px;
            border-radius: 6px;
            align-self: flex-end;
            white-space: pre-wrap;
        }

        .bot-message {
            background: #e2e3e5;
            margin: 6px 0;
            padding: 8px;
            border-radius: 6px;
            align-self: flex-start;
            white-space: pre-wrap;
        }

        .chat-input {
            display: flex;
            border-top: 1px solid #ccc;
        }

        .chat-input input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
        }

        .chat-input button {
            padding: 10px 15px;
            border: none;
            background: #2c3e50;
            color: white;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="chat-container">
    <div class="chat-header">Legal AI Assistant</div>

    <div id="chatMessages" class="chat-messages"></div>

    <div class="chat-input">
        <input id="userInput" type="text" placeholder="Describe your legal issue..." />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
function addMessage(sender, text) {
    const chat = document.getElementById("chatMessages");
    const msg = document.createElement("div");

    msg.className = sender === "user" ? "user-message" : "bot-message";
    msg.textContent = text;

    chat.appendChild(msg);
    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage() {
    const input = document.getElementById("userInput");
    const userMessage = input.value.trim();

    if (!userMessage) return;

    addMessage("user", userMessage);
    input.value = "";

    try {
        const response = await fetch("http://127.0.0.1:8000/process_case", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: userMessage })
        });

        if (!response.ok) {
            throw new Error("Backend error");
        }

        const data = await response.json();
        console.log("Backend response:", data);

        const lawyer = data.lawyer_recommendation.recommended_lawyer;

        const formattedResponse = `
📌 CASE ANALYSIS
${data.case_analysis}

⚠️ RISK ANALYSIS
${data.risk_analysis}

👨‍⚖️ RECOMMENDED LAWYER
Name: ${lawyer.name}
City: ${lawyer.city}
Practice Area: ${lawyer.practice_area}
Experience: ${lawyer.years_of_experience} years
Languages: ${lawyer.languages}
Availability: ${lawyer.availability}
        `.trim();

        addMessage("bot", formattedResponse);

    } catch (error) {
        console.error(error);
        addMessage("bot", "❌ Failed to connect to backend.");
    }
}
</script>

</body>
</html>
